schemaVersion: mechanize.dev/v1alpha1
kind: CapabilitiesRegistry

# Registered abstract capabilities. `fixture` is a universally-admitted
# provider variant for every capability (used by tests and pinned-fixture
# staging). Remote-mode Sentinels using `provider: fixture` FAIL sentinel-lint
# R10 unless `execution.allowFixtures: true`.
capabilities:
  observability.list-services:
    providers: [lakerunner, mcp]
  observability.query-metrics:
    providers: [lakerunner, prometheus, mcp]
  observability.query-logs:
    providers: [lakerunner, mcp]
  observability.error-overview:
    providers: [lakerunner, mcp]
  code.grep:
    providers: [github-checkout, gitlab-checkout]
  code.read:
    providers: [github-checkout, gitlab-checkout]

  # HTTP fetches against a public endpoint. `-with-summary` returns an LLM
  # projection of the response rather than the raw body, which is what a
  # status-page check actually consumes. Distinct from observability.*: those
  # query a telemetry backend for this org's own signals, this one reads a
  # third party's public status.
  #
  # NOTE: `http-get` is not implemented — no spike/executor/providers/http_get.py
  # exists, so this capability is runnable only under `provider: fixture` today.
  # It is listed because `providers:` declares which bindings are ALLOWED, not
  # which are built (the llm.* entries below name models, never modules). A
  # live binding needs the provider written first; reaching arbitrary URLs is a
  # security surface that wants its own review (SSRF, redirects, timeouts).
  web.fetch-with-summary:
    providers: [http-get]

  # LLM capabilities live under capabilities.llm.<subclass>.
  # R10 and R13 look them up the same way as tool capabilities.
  llm.analytical-small:
    providers: [claude-haiku-4-5, gemini-flash-2]
  llm.analytical-large:
    providers: [claude-opus-5, claude-sonnet-5]

integrations:
  runtime:
    - id: k8s-controller
      allowsBlockUntilAnswered: true
    - id: ci-plugin
      allowsBlockUntilAnswered: false
      maxWallClockHours: 6
    - id: daemon                   # Phase 2's long-running service form.
      allowsBlockUntilAnswered: true
    - id: manual
      allowsBlockUntilAnswered: true
  channel:
    - id: slack.socket-mode
    - id: cli-prompt               # Phase 1 stdin/stdout for local dev.
    - id: test.mock                # In-memory driver for pytest; runtime rejects in remote mode.
    - id: ticket.jira
    - id: email
    - id: pagerduty.incident
  sink:
    - id: outcomes-dashboard
    - id: slack
    - id: pagerduty
    - id: jira
    - id: stdout                   # Phase 1 findings sink.
