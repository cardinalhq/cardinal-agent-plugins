schemaVersion: mechanize.dev/v1alpha1
kind: SentinelDeployment
runtime: k8s-controller

# Each binding here is replaced WHOLESALE by the CR's binding for the same id
# (projections.py) — the CR's is the one carrying endpoint_env/token_env.
# These exist so lint R10 passes and so the intent is readable in the repo.
# Deliberately no `execution.allowFixtures`: its absence is what makes a stray
# `provider: fixture` fail lint instead of quietly faking a finding.
capabilityBindings:
  observability.list-services:  {provider: mcp}
  observability.error-overview: {provider: mcp}
  observability.query-logs:     {provider: mcp}
  observability.query-metrics:  {provider: mcp}

inputBindings:
  instance:                 {source: dispatch}
  serviceQuery:             {source: dispatch}
  window:                   {source: dispatch}
  cpuLimitPeakThreshold:    {source: dispatch}
  memoryLimitPeakThreshold: {source: dispatch}
  minAvailableReplicas:     {source: dispatch}
  aggregationBucket:        {source: dispatch}

# Load-bearing: `spec.sinks` on the CR is a dead key, so without a routing
# rule no finding is delivered at all.
findingsRouting:
  - match: {"*": true}
    sink: stdout

functions:
  pick-resolved-service:              {network: disabled, filesystem: none}
  compute-health-summary:             {network: disabled, filesystem: none}
  compute-error-count-reconciliation: {network: disabled, filesystem: none}
