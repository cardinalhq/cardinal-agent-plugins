apiVersion: mechanize.dev/v1alpha1
kind: Sentinel
metadata:
  name: statuspage-service-health-check
  version: 0.1.0
  trial:
    status: passed
    ranAt: 2026-08-07T05:38:50Z
    checks: "T1-T9"
spec:
  purpose:
    summary: >
      Fetch a service's public statuspage-shaped endpoint via an LLM-projecting
      web fetch, extract the overall-status indicator, and emit a health-status
      finding whose severity is derived from that indicator.
    reusableQuestion: >
      Is service X reporting healthy on its public statuspage endpoint right now?
    conclusionType: service-health-assessment
  inputs:
    service:
      type: string
      required: true
    statusEndpoint:
      type: string
      required: true
    summaryPrompt:
      type: string
      default: "Extract overall service status and description."
  capabilities:
    required:
      - id: web.fetch-with-summary
        capabilityType: tool
  variationPoints:
    - path: /spec/inputs/service
      operations: [bind]
    - path: /spec/inputs/statusEndpoint
      operations: [bind]
    - path: /spec/inputs/summaryPrompt/default
      operations: [replace]
  nodes:
    fetch-status-summary:
      kind: tool
      dependsOn: []
      config:
        toolRef: web.fetch-with-summary
        arguments:
          url: "${inputs.statusEndpoint}"
          prompt: "${inputs.summaryPrompt}"
      output:
        schema:
          type: object
          required: [text]
          properties:
            text: { type: string }
    classify-status:
      kind: function
      dependsOn: [fetch-status-summary]
      config:
        runtime: python3.12
        source: functions/classify-status.py
        entrypoint: run
        arguments:
          response: "${nodes.fetch-status-summary.output}"
      output:
        schema:
          type: object
          required: [indicator, description, level]
          properties:
            indicator: { type: string }
            description: { type: string }
            level:
              type: string
              enum: [operational, degraded, incident, unknown]
    emit-health-status:
      kind: emit
      dependsOn: [fetch-status-summary, classify-status]
      config:
        finding:
          type: service-health-status
          title: "${inputs.service} health: ${nodes.classify-status.output.description}"
          severityExpression: >
            nodes.classify-status.output.level == "operational" ? "info" :
            (nodes.classify-status.output.level == "incident" ? "critical" : "warning")
          dedupeKey: "${inputs.service}:${nodes.classify-status.output.indicator}"
          evidence:
            - nodeRef: classify-status
              field: output
            - nodeRef: fetch-status-summary
              field: text
  outputs:
    finding:
      value: "${nodes.emit-health-status.output}"
      required: true
  execution:
    concurrency: 1
    failureMode: fail-fast
    defaultTimeout: 1m
