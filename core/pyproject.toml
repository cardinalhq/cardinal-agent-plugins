[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardinal-agent-core"
version = "0.4.0"
description = "Shared Cardinal agent runtime: telemetry contracts and typed Semantic DAG emission."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "CardinalHQ", email = "support@cardinalhq.io" }]

[project.urls]
Homepage = "https://github.com/cardinalhq/cardinal-agent-plugins"

[tool.setuptools.packages.find]
include = ["cardinal_core*"]
