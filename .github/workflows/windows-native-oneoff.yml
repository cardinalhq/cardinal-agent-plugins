name: Windows native (one-off)

# A real Windows runner, for what Wine and the simulation cannot show (#244
# allows "a one-off windows-latest run"). Not part of the required checks:
# it runs when asked for, and on a pull request that changes this file or the
# storyboard preview renderer. It does not run Copilot CLI.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-native-oneoff.yml'
      - 'common/storyboard/scripts/render_preview.py'

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      CARDINAL_REQUIRE_PWSH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter
        run: python -c "import os, sys, locale; print(sys.version); print(os.name, locale.getpreferredencoding(False), sys.stdout.encoding)"
      - name: What msvcrt.locking reports (free, held, free, invalid)
        if: always()
        run: python tests/windows/lock_probe.py
      - name: cardinal_core Windows branches (locks on real msvcrt, kernel32 liveness and parent)
        if: always()
        working-directory: core
        run: python -m unittest discover tests -p "test_windows_sim.py" -v
      - name: Behavior runtime imports and locks
        if: always()
        run: python -m unittest discover -s common/behavior/tests -p "test_windows_sim.py" -v
      - name: The runner's own tests
        if: always()
        run: python -m unittest discover -s tests/windows -v
      - name: Evidence gate on Windows spellings
        if: always()
        working-directory: core
        run: python -m unittest discover tests -p "test_evidence_gate_windows.py" -v
      - name: Copilot hook commands under pwsh, UTF-8, launcher (needs 3.11+)
        if: always() && matrix.python != '3.9'
        run: |
          python build/vendor.py copilot
          cd adapters/copilot
          python -m unittest discover tests -p "test_copilot_windows.py" -v
      - name: Storyboard preview renders a PNG with an installed browser
        if: always()
        shell: pwsh
        run: |
          Set-Content -Path page.html -Encoding utf8 -Value '<!doctype html><html><body style="margin:0;background:#246"><h1 style="color:#fff">preview</h1></body></html>'
          python common/storyboard/scripts/render_preview.py --runtime copilot --static-html page.html --png out.png --viewport 320x200
          $code = $LASTEXITCODE
          if (Test-Path out.png) { $bytes = [System.IO.File]::ReadAllBytes("out.png"); "png bytes: $($bytes.Length), signature: $([System.BitConverter]::ToString($bytes[0..7]))" }
          if ($code -ne 0 -or -not (Test-Path out.png)) { exit 1 }
          if ([System.BitConverter]::ToString($bytes[0..7]) -ne "89-50-4E-47-0D-0A-1A-0A") { exit 1 }
