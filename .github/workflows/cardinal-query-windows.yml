name: Cardinal Query on Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/skills/cardinal-query/**'
      - '.github/workflows/cardinal-query-windows.yml'
      - 'tests/cardinal-query/**'

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the installed skill on Windows PowerShell 5.1
        shell: powershell
        env:
          CARDINAL_QUERY_HTTPS_SMOKE_URL: https://lakerunner-query-api.global.aws.cardinalhq.io
        run: ./tests/cardinal-query/windows-smoke.ps1

  python:
    # The Linux and macOS client, on the oldest Python the skill supports.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test the Python client against the fixture API
        run: python -m unittest discover -s tests/cardinal-query -p 'test_*.py' -v
