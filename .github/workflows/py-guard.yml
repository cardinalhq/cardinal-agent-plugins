name: Python version guard

# Every adapters/*/bin/cardinal-* and adapters/*/scripts/cardinal-* script
# must carry the `cardinal:py311-guard` sentinel. The guard block re-execs
# stock macOS python3 (3.9.6) into python3.13/12/11 when available, so a
# user's first `/cardinal:connect` doesn't die with an opaque TypeError
# on PEP-604 union syntax before they've had a chance to install a
# modern Python.
#
# If this job fails, run `python3 dev/insert-python-guard.py` locally
# and commit the result — the tool is idempotent and inserts the guard
# only where it's missing.

on:
  pull_request:
    paths:
      - "adapters/*/bin/cardinal-*"
      - "adapters/*/scripts/cardinal-*"
      - "dev/insert-python-guard.py"
      - "dev/check-py-guard.sh"
      - ".github/workflows/py-guard.yml"
  push:
    branches: [main]
    paths:
      - "adapters/*/bin/cardinal-*"
      - "adapters/*/scripts/cardinal-*"
      - "dev/insert-python-guard.py"
      - "dev/check-py-guard.sh"
      - ".github/workflows/py-guard.yml"

permissions:
  contents: read

jobs:
  check:
    name: cardinal-* scripts carry py311 guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard sentinel present in every cardinal-* script.
      - name: check-py-guard
        run: bash dev/check-py-guard.sh

      # Extra teeth: every script must still PARSE under Python 3.9 so the
      # guard actually gets a chance to run and re-exec. A PEP-604 annotation
      # placed above the guard by accident would pass check-py-guard.sh
      # (sentinel is present) but still die on macOS system Python before
      # the guard fires.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: py-compile under 3.9
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! python3 -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>/dev/null; then
              echo "FAIL parse under 3.9: $f"
              python3 -c "import py_compile; py_compile.compile('$f', doraise=True)" 2>&1 | tail -3
              fail=1
            fi
          done < <(find adapters -type f \
            \( -path '*/bin/cardinal-*' -o -path '*/scripts/cardinal-*' \) \
            ! -name '*.py' ! -name '*.pyc')
          exit $fail

      # A PEP-604 annotation accidentally placed ABOVE the guard block parses
      # fine under 3.9 (it's a valid expression), then fails at RUNTIME when
      # the def statement evaluates `str | None` before the guard has fired.
      # py-compile can't see that. This step actually runs each script under
      # 3.9 with a stripped PATH so the guard has no 3.11+ to jump to; we
      # then assert exit=1 AND stderr carries the guard's own error string
      # (not a TypeError about `type.__or__`).
      - name: guard fires before any PEP-604 code
        run: |
          set -e
          PY39="$(command -v python3.9)"
          echo "Using: $PY39"
          fail=0
          while IFS= read -r f; do
            # Fresh env, PATH pointing only at a dir with nothing named python3.11+.
            out=$(env -i PATH=/nonexistent HOME=/tmp "$PY39" "$f" 2>&1 < /dev/null || true)
            if ! grep -q "cardinal: needs Python >=3.11" <<<"$out"; then
              echo "FAIL: guard did not fire cleanly for $f — got:"
              echo "$out" | tail -5 | sed 's/^/    /'
              fail=1
            fi
          done < <(find adapters -type f \
            \( -path '*/bin/cardinal-*' -o -path '*/scripts/cardinal-*' \) \
            ! -name '*.py' ! -name '*.pyc')
          exit $fail
