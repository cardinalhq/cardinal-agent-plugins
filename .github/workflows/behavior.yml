name: Behavior plugin

on:
  pull_request:
    paths:
      - 'common/behavior/**'
      - 'common/checks/**'
      - 'core/cardinal_core/checks_*.py'
      - 'core/tests/test_checks_install.py'
      - 'adapters/*/bin/cardinal-behavior'
      - 'adapters/*/bin/cardinal-checks'
      - 'adapters/*/scripts/cardinal-behavior'
      - 'adapters/*/scripts/cardinal-checks'
      - 'adapters/*/scripts/cardinal-connect'
      - 'adapters/*/scripts/cardinal-disconnect'
      - 'adapters/claude/hooks/checks-gate.py'
      - 'adapters/claude/hooks/_checks.py'
      - 'adapters/gemini/extension/hooks/hooks.json'
      - 'adapters/claude/tests/test_checks.py'
      - 'adapters/codex/tests/test_codex_checks.py'
      - 'adapters/cursor/tests/test_cursor_checks.py'
      - 'adapters/gemini/tests/test_gemini_checks.py'
      - 'adapters/gemini/tests/test_connect.py'
      - 'adapters/*/checks/**'
      - 'adapters/*/.mcp.json'
      - 'adapters/*/.claude-plugin/plugin.json'
      - 'adapters/*/.codex-plugin/plugin.json'
      - 'adapters/*/.cursor-plugin/plugin.json'
      - 'adapters/*/.gemini-plugin/plugin.json'
      - 'adapters/gemini/extension/gemini-extension.json'
      - 'build/release.py'
      - 'build/sync_skills.py'
      - 'tests/test_behavior_release.py'
      - '.github/workflows/behavior.yml'
      - '.github/workflows/release-mirrors.yml'
  push:
    branches: [main]
    paths:
      - 'common/behavior/**'
      - 'common/checks/**'
      - 'core/cardinal_core/checks_*.py'
      - 'core/tests/test_checks_install.py'
      - 'adapters/*/bin/cardinal-behavior'
      - 'adapters/*/bin/cardinal-checks'
      - 'adapters/*/scripts/cardinal-behavior'
      - 'adapters/*/scripts/cardinal-checks'
      - 'adapters/*/scripts/cardinal-connect'
      - 'adapters/*/scripts/cardinal-disconnect'
      - 'adapters/claude/hooks/checks-gate.py'
      - 'adapters/claude/hooks/_checks.py'
      - 'adapters/gemini/extension/hooks/hooks.json'
      - 'adapters/claude/tests/test_checks.py'
      - 'adapters/codex/tests/test_codex_checks.py'
      - 'adapters/cursor/tests/test_cursor_checks.py'
      - 'adapters/gemini/tests/test_gemini_checks.py'
      - 'adapters/gemini/tests/test_connect.py'
      - 'adapters/*/checks/**'
      - 'adapters/*/.mcp.json'
      - 'adapters/*/.claude-plugin/plugin.json'
      - 'adapters/*/.codex-plugin/plugin.json'
      - 'adapters/*/.cursor-plugin/plugin.json'
      - 'adapters/*/.gemini-plugin/plugin.json'
      - 'adapters/gemini/extension/gemini-extension.json'
      - 'build/release.py'
      - 'build/sync_skills.py'
      - 'tests/test_behavior_release.py'
      - '.github/workflows/behavior.yml'
      - '.github/workflows/release-mirrors.yml'

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Behavior bridge
        run: python3 -m unittest discover -s common/behavior/tests -v
      - name: Checks preview core (opt-in, CLI)
        run: cd core && python3 -m unittest tests.test_checks_install -v
      - name: Checks skill templates in sync
        run: python3 build/sync_skills.py --check
      - name: Packaged behavior MCP smoke test (all four adapters)
        run: python3 -m unittest discover -s tests -p test_behavior_release.py -v
      # Adapter suites need 3.11+ (tomllib, runtime `X | None`), as in investigation-tests.yml.
      - name: Checks preview in each adapter (connect, disconnect, skill, gate)
        if: matrix.python-version != '3.9'
        run: |
          python3 build/vendor.py claude codex cursor gemini
          (cd adapters/claude && python3 -m unittest tests.test_checks -v)
          (cd adapters/codex && python3 -m unittest tests.test_codex_checks -v)
          (cd adapters/cursor && python3 -m unittest tests.test_cursor_checks -v)
          (cd adapters/gemini && python3 -m unittest tests.test_gemini_checks tests.test_connect -v)
