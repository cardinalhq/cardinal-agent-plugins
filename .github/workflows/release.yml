# Publishes the pip-shipped core package to PyPI via OIDC trusted
# publishing. No long-lived PYPI_API_TOKEN — PyPI verifies the GitHub
# Actions identity (owner + repo + workflow filename + environment name)
# at publish time.
#
# Tag scheme:
#   core-vX.Y.Z  -> publishes cardinal-agent-core  from core/
#
# One-time PyPI setup (done in PyPI web UI as CardinalHQ):
#   Account -> Publishing -> Add a new pending publisher
#     PyPI project name:  cardinal-agent-core
#     Owner:              cardinalhq
#     Repository:         cardinal-agent-plugins
#     Workflow name:      release.yml
#     Environment name:   pypi-core
#
# The GitHub Environment (pypi-core) is also created in the repo's
# Settings -> Environments so the workflow's `environment:` block
# resolves. Optional protection rules (reviewers, wait timer) go there.

name: Release to PyPI

on:
  push:
    tags:
      - "core-v*"

jobs:
  publish-core:
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi-core
      url: https://pypi.org/p/cardinal-agent-core
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: core
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: core/dist
