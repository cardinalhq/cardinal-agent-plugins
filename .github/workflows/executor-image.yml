name: Build sentinel-executor image

# Publishes ghcr.io/cardinalhq/sentinel-executor:v<X.Y.Z> on merges to main
# that touch the executor source or the shared common/mechanize tree it
# bundles into the image.
#
# Version comes from spike/executor/VERSION. The workflow is a no-op if
# the tag already exists in GHCR — bump VERSION to publish a new image.
#
# Auth: GHCR pushes ride ${{ secrets.GITHUB_TOKEN }} with packages:write.
# The mirror deploy-keys pattern used by release-mirrors.yml only applies
# to pushes to external mirror repos; GHCR sits under this same repo's
# org and takes the built-in token cleanly.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'spike/executor/**'
      - 'common/mechanize/**'
      - '.github/workflows/executor-image.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cardinalhq/sentinel-executor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        # Fails fast if VERSION is missing / empty so we never tag as `v`.
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < spike/executor/VERSION)
          if [ -z "$VERSION" ]; then
            echo "spike/executor/VERSION is empty" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists in GHCR
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `docker manifest inspect` against the GHCR registry works for
        # public + private packages under the same org once we're logged
        # in. If it succeeds the tag exists → skip the build.
        run: |
          set -euo pipefail
          REF="${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.tag }}"
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::${REF} already published — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.exists.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root so the Dockerfile can COPY
          # both spike/executor/ and common/ (lint.py imports
          # common.mechanize.ratification via a parents[2] lookup, which
          # only resolves if the repo layout is preserved in the image).
          context: .
          file: spike/executor/Dockerfile
          push: true
          # Prod clusters run arm64 Graviton nodes; amd64 kept for local
          # dev on x86. Same fix as controller-image.yml applied here.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.title=sentinel-executor
            org.opencontainers.image.description=Runtime image for Cardinal Sentinels (executor + lint + preview)
          # Buildx layer cache scoped to this workflow so an unchanged
          # requirements.txt keeps the pip layer warm across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
