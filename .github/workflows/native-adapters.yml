name: Native OpenCode and Pi adapters

on:
  pull_request:
    paths:
      - 'adapters/opencode/**'
      - 'adapters/pi/**'
      - 'common/native/**'
      - 'core/**'
      - 'build/native.py'
      - 'tests/native/**'
      - 'tests/test_native.py'
      - 'tests/test_contract.py'
      - 'package*.json'
      - '.github/workflows/native-adapters.yml'
  push:
    branches: [main]
    tags: ['opencode-v*', 'pi-v*']
    paths:
      - 'adapters/opencode/**'
      - 'adapters/pi/**'
      - 'common/native/**'
      - 'core/**'
      - 'build/native.py'
      - 'tests/native/**'
      - 'tests/test_native.py'
      - 'tests/test_contract.py'
      - 'package*.json'
      - '.github/workflows/native-adapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native adapters, published API types, real Pi loader, MCP and packed-install tests
        run: npm run test:native
      - name: Python contract and lifecycle tests
        run: python3 -m unittest discover tests -p test_native.py -v
      - name: Existing cross-adapter contracts
        run: python3 -m unittest discover tests -p test_contract.py -v
      - name: Core suite
        working-directory: core
        run: python3 -m unittest discover tests
      - name: Pack distributable artifacts
        run: |
          npm pack ./dist/native/opencode --pack-destination ./dist/native
          npm pack ./dist/native/pi --pack-destination ./dist/native
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: cardinal-native-plugins
          path: dist/native/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/opencode-v') || startsWith(github.ref, 'refs/tags/pi-v')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cardinal-native-plugins
          path: release-artifacts
      - name: Verify tag and prepare release notes
        env:
          RELEASE_TAG: '${{ github.ref_name }}'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          runtime, version = tag.split('-v', 1)
          assert runtime in ('opencode', 'pi'), f'Unknown runtime: {runtime}'
          manifest = json.loads(Path(f'adapters/{runtime}/package.json').read_text())
          assert manifest['version'] == version, 'Release tag must match package.json version'
          artifact = f'cardinalhq-{runtime}-plugin-{version}.tgz'
          assert (Path('release-artifacts') / artifact).is_file(), 'Missing package artifact'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_ARTIFACT={artifact}\n')
          label = 'OpenCode' if runtime == 'opencode' else 'Pi'
          compatibility = 'OpenCode 1.18.30 (1.x server-plugin API)' if runtime == 'opencode' else 'Pi 0.85.1 (@earendil-works/pi-coding-agent)'
          Path('release-notes.md').write_text(
              f'Cardinal for {label}: session, model usage, and tool telemetry with MCP access.\n\n'
              f'Compatibility: {compatibility}; Python 3.9+ on macOS/Linux. '
              'See the installation guide for Node requirements.\n\n'
              f'Download `{artifact}` and install it using the '
              f'[installation guide](https://github.com/cardinalhq/cardinal-agent-plugins/blob/{tag}/adapters/{runtime}/README.md).\n\n'
              'The package passed native integration, MCP, installed-artifact, and Python 3.9/3.12 checks.\n\n'
              '**Rollout prerequisite:** Lakerunner session analytics must admit the new runtime and map its capability identity. '
              'This release does not include spend enforcement or subscription-plan reporting. '
              f'See [rollout requirements](https://github.com/cardinalhq/cardinal-agent-plugins/blob/{tag}/docs/RELEASING-NATIVE.md#backend-rollout-dependencies).\n'
          )
          PY
      - name: Publish GitHub release with the tested package
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_TAG: '${{ github.ref_name }}'
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if [ "$(python3 -c 'import json; print(json.load(open("release-state.json"))["isDraft"])')" = False ]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release-artifacts/$RELEASE_ARTIFACT" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
