name: Shared skills sync

# Shared skill cores (common/<skill>/) must be byte-identical in every
# adapter's skills/<skill>/, because each adapter ships as a self-contained
# plugin. build/sync_skills.py is the source of truth; --check fails on drift.

on:
  pull_request:
    paths:
      - "common/migrate-from-grafana/**"
      - "adapters/*/skills/migrate-from-grafana/**"
      - "common/onboard-alloy/**"
      - "adapters/*/skills/onboard-alloy/**"
      - "tests/onboard_alloy/**"
      - "tests/migrate_grafana/**"
      - "tests/test_migrate_connect_scopes.py"
      - "build/sync_skills.py"
      - ".github/workflows/skills-sync.yml"
  push:
    branches: [main]
    paths:
      - "common/migrate-from-grafana/**"
      - "adapters/*/skills/migrate-from-grafana/**"
      - "common/onboard-alloy/**"
      - "adapters/*/skills/onboard-alloy/**"
      - "tests/onboard_alloy/**"
      - "tests/migrate_grafana/**"
      - "tests/test_migrate_connect_scopes.py"
      - "build/sync_skills.py"
      - ".github/workflows/skills-sync.yml"
  workflow_dispatch:

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify shared skill cores are in sync across adapters
        run: python3 build/sync_skills.py --check

  onboard-alloy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: onboard-alloy scripts (parser, inventory, render, lint)
        run: python3 -m unittest discover -s tests/onboard_alloy -v

  migrate-grafana-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: migrate-from-grafana scripts (histogram translation, label drops, probes, Grafana comparison)
        run: python3 -m unittest discover -s tests/migrate_grafana -v
      - name: migrate-from-grafana connect scopes
        run: python3 -m unittest discover tests -p test_migrate_connect_scopes.py -v
