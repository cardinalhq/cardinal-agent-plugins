name: Investigation core and adapters

on:
  pull_request:
    paths:
      - 'core/**'
      - 'adapters/claude/**'
      - 'adapters/codex/**'
      - 'build/vendor.py'
      - '.github/workflows/investigation-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core unittest suite
        run: cd core && python3 -m unittest discover tests
      - name: Claude adapter unittest suite
        run: python3 build/vendor.py claude && (cd adapters/claude && python3 -m unittest discover tests)
      - name: Codex adapter unittest suite
        run: python3 build/vendor.py codex && (cd adapters/codex && python3 -m unittest discover tests)
