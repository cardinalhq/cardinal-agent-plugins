name: Investigation core and adapters

on:
  pull_request:
    paths:
      - 'core/**'
      - 'adapters/claude/**'
      - 'adapters/codex/**'
      - 'adapters/cursor/**'
      - 'adapters/gemini/**'
      - 'build/vendor.py'
      - '.github/workflows/investigation-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core unittest suite
        run: cd core && python3 -m unittest discover tests
      # Adapter suites need 3.11+ (tomllib, runtime `X | None`); core stays on 3.9 + 3.12.
      - name: Claude adapter unittest suite
        if: matrix.python-version != '3.9'
        run: python3 build/vendor.py claude && (cd adapters/claude && python3 -m unittest discover tests)
      - name: Codex adapter unittest suite
        if: matrix.python-version != '3.9'
        run: python3 build/vendor.py codex && (cd adapters/codex && python3 -m unittest discover tests)
      - name: Cursor adapter unittest suite
        if: matrix.python-version != '3.9'
        run: python3 build/vendor.py cursor && (cd adapters/cursor && python3 -m unittest discover tests)
      - name: Gemini CLI adapter unittest suite
        if: matrix.python-version != '3.9'
        run: python3 build/vendor.py gemini && (cd adapters/gemini && python3 -m unittest discover tests)
